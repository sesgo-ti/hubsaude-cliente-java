# Configuração ArchUnit deste cliente (replicada localmente — sem
# dependência do monorepo HubSaúde). Permite a criação automática do
# "store" de violações na primeira execução (FreezingArchRule),
# gravando as violações pré-existentes como linha-base. A partir daí,
# qualquer violação NOVA derruba o build; correções refletem-se
# reduzindo o baseline (basta editar o store ou rodar com a propriedade
# `freeze.refreeze=true`).
#
# Os arquivos do store ficam em `src/test/resources/archunit_store/`
# — local convencional, versionado junto aos testes para que o
# baseline seja compartilhado entre devs/CI.
freeze.store.default.allowStoreCreation=true
freeze.store.default.path=src/test/resources/archunit_store
freeze.refreeze=false
